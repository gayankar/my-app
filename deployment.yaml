apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        emptyDir: {}
      initContainers:
      - name: copy-html
        image: busybox
        command: ['sh', '-c', 'cp /tmp/index.html /usr/share/nginx/html/ || echo "No index.html found"']
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
